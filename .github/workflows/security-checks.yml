name: ContextKey security checks

on:
  pull_request:
    branches: ["main"]
  push:
    branches: ["security-hardening"]

permissions:
  contents: read

jobs:
  security-checks:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check JavaScript syntax
        run: node --check app.js
      - name: Run security regression guards
        run: node --test tests/security-guards.test.mjs
