name: ContextKey security checks

on:
  pull_request:
    branches: ["main"]
  push:
    branches: ["security-hardening", "release-hardening"]

permissions:
  contents: read

jobs:
  security-checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          package-manager-cache: false
      - name: Check JavaScript syntax
        run: |
          node --check app.js
          node --check sw.js
          node --check legal.js
      - name: Run static security regression guards
        run: node --test tests/*.test.mjs
      - name: Install Playwright
        run: npm install --no-save --no-package-lock playwright@1.65.1
      - name: Install Chromium
        run: ./node_modules/.bin/playwright install --with-deps chromium
      - name: Start static test server
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 >/tmp/contextkey-server.log 2>&1 &
          SERVER_PID=$!
          echo "$SERVER_PID" > /tmp/contextkey-server.pid
          for attempt in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:4173/ >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/contextkey-server.log
          exit 1
      - name: Run browser security regression
        run: node tests/browser-security.spec.cjs
      - name: Stop static test server
        if: always()
        run: |
          if [ -f /tmp/contextkey-server.pid ]; then
            kill "$(cat /tmp/contextkey-server.pid)" 2>/dev/null || true
          fi
