name: ContextKey quality checks

on:
  pull_request:
  push:
    branches: ["main"]

permissions:
  contents: read

jobs:
  static-regressions:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run security and product regression tests
        run: node --test tests/security-guards.test.mjs
